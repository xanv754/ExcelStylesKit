[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "exceltablekit"
version = "2.0.0"
description = "Python library for defining and styling Excel table ranges as objects, built on top of openpyxl."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Angyee Marin", email = "angyeemarin.dev@gmail.com" }
]
keywords = ["excel", "styles", "openpyxl", "xlsx", "design", "colors"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.0.0",
    "et-xmlfile>=1.1.0",
    "openpyxl>=3.1.5",
    "tabulate>=0.10.0"
]

[project.urls]
Homepage = "https://github.com/xanv754/ExcelTableKit"

[project.optional-dependencies]
dev = ["black"]

[project.scripts]
exceltablekit = "exceltablekit.__main__:cli"

[tool.setuptools.packages.find]
where = ["."]
